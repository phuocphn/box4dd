<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="title">
  <title id="title">box4dd</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4C8DFF"/>
      <stop offset="1" stop-color="#6A3DF0"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#1B1060" flood-opacity="0.35"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#1B1060" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- App-icon background -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>

  <!-- Shake motion arcs -->
  <g fill="none" stroke="#FFFFFF" stroke-linecap="round">
    <path d="M86 196 Q60 256 86 316" stroke-width="16" opacity="0.85"/>
    <path d="M426 196 Q452 256 426 316" stroke-width="16" opacity="0.85"/>
    <path d="M52 168 Q16 256 52 344" stroke-width="12" opacity="0.4"/>
    <path d="M460 168 Q496 256 460 344" stroke-width="12" opacity="0.4"/>
  </g>

  <!-- The Shelf: a floating panel with a title strip -->
  <g filter="url(#shadow)">
    <rect x="116" y="112" width="280" height="296" rx="40" fill="#FFFFFF"/>
  </g>
  <circle cx="150" cy="146" r="9" fill="#FF6159"/>
  <circle cx="176" cy="146" r="9" fill="#E3E6F5"/>

  <!-- Its Stack of Items -->
  <g filter="url(#soft)">
    <rect x="186" y="196" width="112" height="140" rx="16" fill="#FFB547" transform="rotate(-14 242 266)"/>
    <rect x="214" y="196" width="112" height="140" rx="16" fill="#3DD68C" transform="rotate(10 270 266)"/>
    <rect x="200" y="188" width="112" height="140" rx="16" fill="#6A3DF0"/>
  </g>
  <g stroke="#FFFFFF" stroke-linecap="round" stroke-width="11" opacity="0.9">
    <line x1="224" y1="222" x2="288" y2="222"/>
    <line x1="224" y1="248" x2="288" y2="248"/>
    <line x1="224" y1="274" x2="264" y2="274"/>
  </g>

  <!-- Item count -->
  <g filter="url(#soft)">
    <circle cx="330" cy="352" r="30" fill="#FF6159"/>
  </g>
  <text x="330" y="364" text-anchor="middle" font-family="-apple-system, 'SF Pro Rounded', 'Helvetica Neue', Arial, sans-serif" font-size="34" font-weight="700" fill="#FFFFFF">3</text>
</svg>
